name: Inferact
description: >-
  Inferact is a startup founded by the creators and core maintainers of vLLM,
  the widely adopted open-source large language model inference engine. The
  company exists to supercharge vLLM adoption, developing inference and serving
  optimizations at the frontier where models meet hardware at scale and flowing
  those improvements back into the open-source community. As of January 2026 the
  company had raised roughly $150M at an $800M valuation and is recruiting
  engineers and researchers. As of this enrichment pass Inferact publishes only
  a company announcement page at inferact.ai and does not yet expose a public
  API, developer portal, SDKs, or commercial product docs.
